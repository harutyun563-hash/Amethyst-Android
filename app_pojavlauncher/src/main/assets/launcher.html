<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Launcher</title>
<style>
:root{
  --stone:#c6c6c6; --hi:#fff; --lo:#555; --ink:#3f3f3f;
  --sky:#8fcdfb; --sky2:#d8f0ff; --grass:#5da130; --grass2:#7bc043; --dirt:#8a5a2c;
  --green:#5ea832; --green-hi:#93e05a; --green-lo:#2d5a14;
  --font:ui-monospace,Menlo,Consolas,"Courier New",monospace;
}
*{box-sizing:border-box;margin:0;padding:0;image-rendering:pixelated}
html,body{height:100%;font-family:var(--font);font-size:14px;color:var(--ink);
  background:linear-gradient(var(--sky) 0 65%,var(--sky2));overflow-x:hidden}

/* земля и облака */
body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:16vh;z-index:-1;pointer-events:none;
  background:
    repeating-linear-gradient(90deg,rgba(0,0,0,.09) 0 8px,transparent 8px 16px),
    linear-gradient(var(--grass2) 0 6px,var(--grass) 6px 24px,var(--dirt) 24px)}
.cloud{position:fixed;z-index:-1;width:48px;height:16px;background:#fff;pointer-events:none;
  box-shadow:16px -16px 0 #fff,32px -16px 0 #fff,48px 0 0 #fff,64px 0 0 #fff,-16px 0 0 #fff}
.c1{top:9%;left:6%}.c2{top:20%;left:62%;transform:scale(.8)}

main{min-height:100%;max-width:940px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:center;
  padding:10px max(18px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left))}
.hero,.side{display:flex;flex-direction:column;gap:12px}

h1{font-size:clamp(26px,9vh,46px);color:#fff;letter-spacing:4px;text-transform:uppercase;line-height:1;
  text-shadow:3px 3px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink)}
.sub{color:#fff;font-size:12px;text-shadow:2px 2px 0 var(--ink);margin-top:-4px}

/* панель в стиле меню игры */
.gui{background:var(--stone);border:4px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);
  box-shadow:0 0 0 3px #000;padding:12px;display:flex;flex-direction:column;gap:10px}
label{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:bold;text-transform:uppercase;letter-spacing:1px}
.row{display:flex;justify-content:space-between}

input[type=text],select{background:#000;color:#fff;font:inherit;border-radius:0;outline:none;padding:8px;width:100%;
  border:3px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo)}
input[type=text]:focus,select:focus{outline:2px solid #fff;outline-offset:1px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:#000;border-radius:0;
  border:3px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:24px;border-radius:0;
  background:var(--stone);border:3px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);box-shadow:0 0 0 2px #000}

#play{font:inherit;font-weight:bold;font-size:clamp(16px,5vh,24px);text-transform:uppercase;letter-spacing:3px;color:#fff;
  text-shadow:2px 2px 0 var(--green-lo);background:var(--green);border-radius:0;padding:clamp(10px,3.5vh,18px);
  border:4px solid;border-color:var(--green-hi) var(--green-lo) var(--green-lo) var(--green-hi);box-shadow:0 0 0 3px #000}
#play:active{background:#4b8a28;border-color:var(--green-lo) var(--green-hi) var(--green-hi) var(--green-lo)}
#play:disabled{background:#8a8a8a;color:#d0d0d0;text-shadow:2px 2px 0 #555;border-color:#b0b0b0 #555 #555 #b0b0b0}

.bar{height:18px;background:#000;border:3px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);position:relative}
#fill{height:100%;width:0;background:var(--green-hi);box-shadow:inset 0 -4px 0 var(--green);transition:width .2s steps(8)}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 10px,#000 10px 12px)}
#status{font-size:12px;min-height:15px}
#log{background:#000;color:#9fe870;border:3px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);
  height:clamp(48px,16vh,90px);overflow-y:auto;padding:6px;font-size:11px;line-height:1.4;white-space:pre-wrap;word-break:break-all}

#native{font:inherit;font-weight:bold;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--ink);
  background:var(--stone);border-radius:0;padding:10px;border:4px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);box-shadow:0 0 0 2px #000}
#native:active{border-color:var(--lo) var(--hi) var(--hi) var(--lo)}

@media (orientation:portrait){
  main{grid-template-columns:1fr;align-content:start;padding-top:calc(14px + env(safe-area-inset-top,0px))}
}
</style>
</head>
<body>
<div class="cloud c1"></div><div class="cloud c2"></div>
<main>
  <section class="hero">
    <h1>MineLaunch</h1>
    <p class="sub">Java Edition · Android</p>
    <button id="play">Играть</button>
    <div class="gui">
      <div class="bar"><div id="fill"></div></div>
      <div id="status">Готов к запуску</div>
    </div>
  </section>

  <section class="side">
    <div class="gui">
      <button id="native" type="button">Аккаунт и настройки</button>
      <label>Версия
        <select id="ver"></select>
      </label>
    </div>
    <div id="log"></div>
  </section>
</main>

<script>
/* ===== Мост к Android =====
   Нативная часть добавляет объект window.Android с методами:
     getInstalledVersions() -> строка JSON, например '["1.21.1","1.8.9"]'
     startGame(version)
     openNative()  - скрыть HTML и показать обычный экран (аккаунты, настройки)
   и вызывает в ответ функции этой страницы:
     onProgress(percent, text), onLog(text), onGameStarted(), onError(text)
   Без Android-моста страница работает в демо-режиме (для проверки в браузере). */
const A = window.Android;
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
};

function log(t){ const l = $('log'); l.textContent += t + '\n'; l.scrollTop = l.scrollHeight; }
function setProgress(p, t){ $('fill').style.width = p + '%'; if (t !== undefined) $('status').textContent = t; }
function lock(on){ $('play').disabled = on; $('play').textContent = on ? 'Запуск…' : 'Играть'; }

window.onProgress = setProgress;
window.onLog = log;
window.onGameStarted = () => { setProgress(100, 'Игра запущена'); lock(false); };
window.onError = m => { log('! ' + m); setProgress(0, 'Ошибка'); lock(false); };

function loadVersions(){
  let list = [];
  try { list = JSON.parse(A ? A.getInstalledVersions() : '[]'); } catch(e){}
  ['1.21.1', '1.20.4', '1.16.5', '1.12.2', '1.8.9'].forEach(v => { if (!list.includes(v)) list.push(v); });
  const sel = $('ver');
  sel.innerHTML = '';
  list.forEach(v => { const o = document.createElement('option'); o.value = o.textContent = v; sel.appendChild(o); });
  sel.value = store.get('ver', list[0]);
  if (!sel.value) sel.value = list[0];
}

loadVersions();
$('native').onclick = () => { if (A) A.openNative(); else log('(демо) открыть обычный экран'); };

$('play').onclick = () => {
  const ver = $('ver').value;
  store.set('ver', ver);
  lock(true);
  setProgress(0, 'Подготовка…');
  log('> ' + ver);
  if (A) { A.startGame(ver); return; }
  // демо-режим
  let p = 0;
  const t = setInterval(() => {
    p += 10; setProgress(p, 'Демо: ' + p + '%');
    if (p >= 100) { clearInterval(t); log('(демо) нативный мост не найден'); window.onGameStarted(); }
  }, 250);
};
</script>
</body>
</html>
